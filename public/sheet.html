<!DOCTYPE html>
   <html>
   <head>
       <title>Mote'z Notes - Sheet</title>
       <meta charset="UTF-8">
   </head>
   <body>
       <h1>Mote'z Notes</h1>
       <p>To view this sheet, please install the Mote'z Notes app.</p>
       <script>
           // Try to open the app
           const urlParams = new URLSearchParams(window.location.search);
           const sheetId = urlParams.get('id');
           if (sheetId) {
               window.location.href = `music_keyboard://sheet?id=${sheetId}`;
           }
       </script>
   </body>
   </html>
