name: music_keyboard
description: "Music notation keyboard."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.7
  google_fonts: ^4.0.4
  screenshot: ^3.0.0
  path_provider: ^2.0.11
  gal: ^2.3.1
  provider: ^6.0.3
  fluttertoast: ^8.2.0
  vector_math: ^2.1.4
  pdf: ^3.10.8
  printing: ^5.12.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  rename_app: ^1.3.1
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.19.0
  firebase_core: ^3.4.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  app_links: ^6.3.2
  share_plus: ^10.0.2
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  fonts:
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf

  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/images/temp-logo.png

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/temp-logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/temp-logo.png
  remove_alpha_ios: true
  remove_alpha_android: true
  background_color_ios: "#ffffff"  # white background, change as needed
  background_color_android: "#ffffff"
